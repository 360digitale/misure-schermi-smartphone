name: Aggiornamento mensile

on:
  schedule:
    - cron: "17 4 1 * *"   # il giorno 1 di ogni mese, verso le 5-6 ora italiana
  workflow_dispatch:        # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Scarica il dataset aggiornato
        run: |
          git clone --depth 1 https://github.com/bytecharts/device_specs_gsmarena.git dataset
          echo "SOURCE_DATE=$(git -C dataset log -1 --format=%cs)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rigenera la pagina
        run: python build/build.py dataset "$SOURCE_DATE"

      - name: Salva la nuova versione
        run: |
          rm -rf dataset
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiornamento dati $(date +%Y-%m)"
            git push
          fi
